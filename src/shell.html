<title>Señores de las Profundidades</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: mesa de juego — tablero grande a la izquierda, panel de mando a la derecha; en el teléfono, apilados. Tema único oscuro: es una caverna. */
:root {
  color-scheme: dark;
  --bg: #17141f;        /* roca profunda */
  --surface: #1f1b29;
  --raised: #29233a;
  --line: #3a3349;
  --ink: #ece6dc;       /* hueso */
  --muted: #a39bb2;
  --accent: #9d78d6;    /* amatista */
  --gold: #d9a441;      /* lujo */
  --win: #8fcf9e;
  --lose: #ef8d84;
  --display: "Grenze", "Palatino Linotype", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
html, body { background: var(--bg); color: var(--ink) }
body { font-family: var(--body); font-size: 16px; line-height: 1.45; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px }
* { box-sizing: border-box }
button { font: inherit; color: inherit }
button:focus-visible, [role="button"]:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
.app { max-width: 1400px; margin: 0 auto }
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; padding-block: 18px 14px; border-bottom: 1px solid var(--line); margin-bottom: 18px }
.brand { display: grid; gap: 2px }
.mark { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 4vw, 38px); line-height: 1; letter-spacing: .01em }
.ver { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .04em }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px }
.tabs button { background: none; border: 0; padding: 7px 14px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 500 }
.tabs button.on { background: var(--raised); color: var(--ink) }

.game { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start }
.boardwrap { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); min-width: 0 }
.board { width: 100%; height: auto; max-height: calc(100vh - 120px); display: block }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); margin-top: 6px; justify-content: center }
.lg { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px }
.lg.dia { background: #2d1f45; border: 1.5px solid #cbb5ee; transform: rotate(45deg) }
.lg.wall { border: 2px dashed var(--ink); border-radius: 50% }
.pick { cursor: pointer; outline: none }
.pick:focus-visible circle.pulse { stroke: #fff; stroke-width: 4 }
@keyframes pulse { 50% { opacity: .45 } }
.pulse { animation: pulse 1.3s ease-in-out infinite }

.side { display: grid; gap: 14px; min-width: 0 }
.side section { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px }
.side h4 { margin: 0 0 10px; font-family: var(--mono); font-size: 11.5px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }
.turn { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)) !important }
.trow { display: flex; justify-content: space-between; align-items: center; gap: 10px }
.eyebrow { font-family: var(--mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }
.who { font-family: var(--display); font-size: 26px; font-weight: 600; display: flex; align-items: center; gap: 8px; line-height: 1.1 }
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #120d1c; flex: none }
.dice { display: flex; gap: 6px }
.hint { margin: 10px 0 0; color: var(--ink) }
.err { margin: 6px 0 0; color: var(--lose); font-size: 14px }
.mrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center }
.btn { border: 1px solid var(--line); background: var(--raised); padding: 9px 16px; border-radius: 7px; cursor: pointer; font-weight: 500 }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #140f1d; font-weight: 700 }
.btn.ghost { background: none }
.btn:hover { filter: brightness(1.12) }
.raidbox { display: grid; gap: 8px; width: 100% }
.raidbox input { width: 100%; accent-color: var(--gold) }

.hand { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px }
.res { display: grid; justify-items: center; gap: 3px; background: var(--raised); border-radius: 7px; padding: 7px 2px 6px }
.res .sw { width: 30px; height: 26px; border-radius: 5px; display: grid; place-items: center }
.res .rl { font-size: 11.5px; color: var(--muted) }
.res b { font-family: var(--mono); font-size: 17px; font-variant-numeric: tabular-nums }
.stats { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 14px }
.stats span { display: inline-flex; align-items: center; gap: 5px }
.expnote { margin: 10px 0 0; font-size: 14px; color: var(--gold) }

.actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px }
.act { text-align: left; background: var(--raised); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; cursor: pointer; display: grid; gap: 1px }
.act b { font-weight: 700; font-size: 14.5px }
.act small { font-family: var(--mono); font-size: 11px; color: var(--muted) }
.act.on { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold) }
.act:disabled { opacity: .38; cursor: not-allowed }
.act:not(:disabled):hover { border-color: var(--accent) }

.cards { display: flex; flex-wrap: wrap; gap: 8px }
.cardbtn { background: none; border: 0; padding: 0; cursor: pointer; border-radius: 8px; transition: transform .15s }
.cardbtn:hover { transform: translateY(-3px) }
.card { display: block; filter: drop-shadow(0 3px 6px rgba(0,0,0,.45)); height: auto }
.card.dim { opacity: .55 }
.newcard, .trapcard { display: grid; justify-items: center; gap: 2px; font-family: var(--mono); font-size: 10.5px; color: var(--muted) }
.muted { color: var(--muted) } .small { font-size: 13px }

.players { display: grid; gap: 8px }
.pl { padding: 8px 10px; border-radius: 7px; background: var(--raised); border: 1px solid transparent }
.pl.cur { border-color: var(--accent) }
.pn { display: flex; align-items: center; gap: 8px }
.pn .pv { margin-left: auto; font-family: var(--mono); font-size: 14px; color: var(--gold) }
.pd { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 12.5px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums }
.pexp { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-top: 4px }
.ptit { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px }
.tag { font-family: var(--mono); font-size: 10.5px; padding: 2px 6px; border-radius: 4px; background: color-mix(in srgb, var(--gold) 18%, transparent); color: var(--gold) }
.log { list-style: none; padding: 0; margin: 0 0 12px; max-height: 260px; overflow-y: auto; font-size: 13.5px; display: grid; gap: 4px }
.log li { padding-bottom: 4px; border-bottom: 1px solid var(--line) }

.scrim { position: fixed; inset: 0; background: rgba(10, 8, 14, .72); display: grid; place-items: center; z-index: 50; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; width: min(560px, 100%); max-height: 100%; overflow-y: auto }
.modal h3 { font-family: var(--display); font-size: 30px; font-weight: 700; margin: 0 0 8px }
.sub { color: var(--muted); margin: 0 0 12px }
.center { text-align: center; display: flex; justify-content: center }
.trapsrow { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px }
@keyframes flip { from { transform: rotateY(90deg); opacity: 0 } to { transform: none; opacity: 1 } }
.flip { animation: flip .5s ease-out both }
.step { margin: 4px 0; font-size: 15px }
.dicecmp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; padding: 10px; background: var(--raised); border-radius: 8px }
.dicecmp .lbl { font-weight: 700; font-size: 14px }
.verdict { font-family: var(--display); font-size: 22px; font-weight: 600; margin: 10px 0 0 }
.win { color: var(--win) } .lose { color: var(--lose) }
.permrow { display: flex; gap: 12px; align-items: center; margin: 8px 0 }
.tradegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px }
.tradegrid.one { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)) }
.tradegrid > div { display: grid; gap: 6px; align-content: start }
.opt { background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; cursor: pointer; text-align: left }
.opt.on { border-color: var(--gold) }
.opt:disabled { opacity: .35; cursor: not-allowed }
.final { display: grid; gap: 6px; font-size: 15px }

.gallery section, .rules { margin-bottom: 40px }
.gallery h2, .rules h2 { font-family: var(--display); font-weight: 700; font-size: 32px; margin: 0 0 6px }
.lead { color: var(--muted); max-width: 70ch; margin: 0 0 16px }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px }
.grid figure, .tokens figure { margin: 0; display: grid; gap: 8px; justify-items: center }
.grid figure .card { width: 100%; max-width: 220px }
figcaption { font-size: 13.5px; color: var(--muted); text-align: center; max-width: 30ch }
figcaption b { color: var(--ink) }
.tokens { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px }
.tokens figure { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 12px }
.tokens .row { display: flex; gap: 10px; align-items: center; min-height: 60px }
.rules { max-width: 70ch }
.rules h3 { font-family: var(--display); font-size: 22px; font-weight: 600; color: var(--gold); margin: 22px 0 6px }
.rules p, .rules li { color: var(--ink) }
.rules li { margin-bottom: 5px }
.stepper { display: grid; grid-template-columns: 26px 1fr 30px 22px auto 30px; align-items: center; gap: 6px }
.stepper .sl { font-size: 13.5px }
.stepper b { font-family: var(--mono); text-align: center }
.sb { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--raised); cursor: pointer; font-weight: 700 }
.sb:disabled { opacity: .35; cursor: not-allowed }
.guard { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px }
.gslot { display: grid; justify-items: center; gap: 1px; background: var(--raised); border-radius: 7px; padding: 8px 2px }
.gslot b { font-family: var(--mono); font-size: 17px }
.gslot span { font-size: 12px }
.gslot small { font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: center }
.fuse { display: grid; gap: 6px; margin-top: 10px }
.pguard { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; font-family: var(--mono); font-size: 12px; color: var(--muted) }
.pguard span { display: inline-flex; align-items: center; gap: 2px }
.rarities { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-bottom: 12px }
.rcard { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 8px }
.rcard .row { display: flex; gap: 6px; justify-content: center; height: 56px; align-items: center }
.rhead { display: flex; justify-content: space-between; align-items: baseline }
.rhead b { font-family: var(--display); font-size: 22px; font-weight: 600 }
.rhead span { font-family: var(--mono); font-size: 12px; color: var(--muted) }
.rmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 13px; color: var(--muted) }
.rcard figcaption { text-align: left; max-width: none; color: var(--ink); font-size: 14px }
.rcard .sprite { width: 100%; max-width: 200px; height: 190px; object-fit: contain; justify-self: center; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)) }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; margin-bottom: 18px }
.tiles figure { margin: 0; display: grid; gap: 8px; justify-items: center; align-content: start }
.tiles .tile { width: 100%; max-width: 170px; height: 180px; object-fit: contain; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)) }
.tiles.bld .tile { height: 150px }
.backdrop { width: 100%; max-width: 760px; display: block; margin: 8px auto 0; filter: drop-shadow(0 10px 20px rgba(0,0,0,.5)) }
.party { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px }
.timer { font-family: var(--mono); font-size: 14px; font-weight: 500; padding: 2px 8px; border-radius: 5px; background: var(--raised); color: var(--muted); margin-left: 6px }
.timer.urgent { background: color-mix(in srgb, var(--lose) 25%, transparent); color: var(--lose) }
.lg.port { border: 2px dashed var(--gold); border-radius: 50% }
.tag.ghosty { background: var(--raised); color: var(--muted); margin-left: 6px }
.modal.wide { width: min(680px, 100%) }
.stepper.slim { grid-template-columns: 1fr 30px 22px auto 30px; gap: 6px }
.linkbtn { background: none; border: 0; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 0 }
.tabs.small { display: inline-flex; margin-bottom: 12px }
.tabs.small button { padding: 6px 10px; font-size: 14px }
.ruins { width: 220px; max-width: 100%; filter: drop-shadow(0 6px 12px rgba(0,0,0,.5)) }
.lobby { max-width: 760px }
.lobby h2 { font-family: var(--display); font-weight: 700; font-size: 32px; margin: 0 0 6px }
.lobby .code, .salarow .code { font-family: var(--mono); letter-spacing: .12em; font-size: 28px; font-weight: 500 }
.salarow .code { font-size: 17px }
.seats { display: grid; gap: 8px; margin: 14px 0 }
.seat { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px }
.seatname { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0 }
.seatbtns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: end }
.dot.big { width: 16px; height: 16px }
.dot.empty { border-width: 2px; border-style: solid }
select, input { font: inherit; color: var(--ink); background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px }
.timers { display: flex; flex-wrap: wrap; gap: 10px 20px; margin: 6px 0 12px; font-size: 14px; color: var(--muted) }
.timers label { display: flex; gap: 8px; align-items: center }
.joinform { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.joinform input { width: 110px; font-family: var(--mono); letter-spacing: .1em }
.listhead { font-family: var(--mono); font-size: 11.5px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px }
.salalist { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px }
.salarow { width: 100%; display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "code state dots" "code host host"; gap: 2px 14px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 10px 14px; cursor: pointer }
.salarow:hover { border-color: var(--accent) }
.salarow .code { grid-area: code } .salarow .seatdots { grid-area: dots; display: flex; gap: 4px }
.loading { padding: 60px 0; text-align: center; color: var(--muted) }

@media (max-width: 960px) {
  .game { grid-template-columns: minmax(0, 1fr) }
  .boardwrap { position: static }
  .board { max-height: none }
}
@media (max-width: 420px) { .hand .rl { display: none } .act small { font-size: 10px } }
@media (prefers-reduced-motion: reduce) { .pulse, .flip { animation: none } .cardbtn { transition: none } }
</style>
<div id="app"><p class="loading">Excavando el tablero…</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
  window.addEventListener('error', function (e) {
    var el = document.getElementById('app');
    if (el && !window.__ok) el.innerHTML = '<p class="loading">No se pudo cargar el juego: ' + String(e.message || e.type).replace(/</g, '&lt;') + '. Recargá la página.</p>';
  }, true);
  if (typeof htm === 'undefined') document.write('<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"><\/script>');
</script>
